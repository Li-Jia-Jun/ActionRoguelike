<text x="791.0" y="243.7" fill="#d9822b" font-size="11" font-weight="700" text-anchor="middle">4</text>
<circle cx="660.0" cy="172.0" r="5.5" fill="#0f9d8a"/>
<text x="650.0" y="192.0" fill="#0f9d8a" font-size="12" font-weight="600" text-anchor="end">from cell</text>
<circle cx="766.3" cy="216.2" r="5.5" fill="#0f9d8a"/>
<line x1="762.3" y1="220.2" x2="738.0" y2="262.0" stroke="#8c959f" stroke-width="0.8" stroke-linecap="round"/>
<text x="742.0" y="276.0" fill="#0f9d8a" font-size="12" font-weight="600" text-anchor="end">next cell</text>
<text x="624.0" y="334.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#1f2328" font-weight="700">1</tspan><tspan fill="#57606a" font-weight="400">  lift ¼ L off the surface</tspan></text>
<text x="624.0" y="351.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#1f2328" font-weight="700">2</tspan><tspan fill="#57606a" font-weight="400">  step L along the tangent</tspan></text>
<text x="624.0" y="368.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#57606a" font-weight="400">     blocked: climb onto the rise, carry on</tspan></text>
<text x="624.0" y="385.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#1f2328" font-weight="700">3</tspan><tspan fill="#57606a" font-weight="400">  trace down along n</tspan></text>
<text x="624.0" y="402.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#57606a" font-weight="400">     miss: a hole or an edge → stop</tspan></text>
<text x="624.0" y="419.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#d9822b" font-weight="700">4</tspan><tspan fill="#57606a" font-weight="400">  chord > 1.05 L: pull back to L, drop again</tspan></text>
<text x="624.0" y="436.0" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#57606a" font-weight="600">turn > MaxTurnPerCell or not a wall → stop</tspan></text>
