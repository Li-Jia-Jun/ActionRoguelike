<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<title>Surface warp of one limb: the shoulder stays fixed, the hand is warped onto the surface and turned, the elbow is solved with the same bone lengths; the reach rule slides an unreachable hand back along the surface</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="419" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="24.0" y="32.0" fill="#1f2328" font-size="15" font-weight="600" text-anchor="start">One limb: what happens to each joint (top view, a right arm)</text>
<clipPath id="c2"><rect x="10" y="44" width="600" height="362"/></clipPath>
<circle cx="130.0" cy="526.0" r="300.0" fill="#f0f3f6" stroke="#d0d7de" clip-path="url(#c2)"/>
<line x1="30.0" y1="226.0" x2="550.0" y2="226.0" stroke="#57606a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="24.0" y="218.0" fill="#57606a" font-size="12" font-weight="600" text-anchor="start">flat wall</text>
<circle cx="210.0" cy="98.0" r="223.2" fill="none" stroke="#57606a" stroke-dasharray="2 4" clip-path="url(#c2)"/>
<path d="M379.6 338.8 L377.5 336.1 L375.4 333.4 L373.4 330.8 L371.3 328.2 L369.2 325.7 L367.1 323.3 L365.1 320.8 L363.0 318.5 L360.9 316.2 L358.8 313.9 L356.8 311.7 L354.7 309.5 L352.6 307.4 L350.5 305.3 L348.5 303.2 L346.4 301.2 L344.3 299.2 L342.2 297.3 L340.2 295.4 L338.1 293.5 L336.0 291.7 L333.9 289.9 L331.8 288.1 L329.8 286.3" fill="none" stroke="#d1543a" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="379.6" cy="338.8" r="5" fill="#ffffff" stroke="#d1543a" stroke-width="1.6"/>
<text x="389.6" y="342.8" fill="#d1543a" font-size="12" font-weight="600" text-anchor="start">warped, but out of reach</text>
<text x="389.6" y="358.8" fill="#d1543a" font-size="12" font-weight="400" text-anchor="start">reach rule: slide back along the surface</text>
<line x1="210.0" y1="98.0" x2="329.9" y2="92.5" stroke="#d1543a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="329.9" y1="92.5" x2="370.0" y2="214.0" stroke="#d1543a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="329.9" y1="92.5" x2="313.1" y2="159.4" stroke="#57606a" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" marker-end="url(#arr)"/>
<line x1="370.0" y1="214.0" x2="329.8" y2="286.3" stroke="#57606a" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" marker-end="url(#arr)"/>
<line x1="210.0" y1="98.0" x2="313.1" y2="159.4" stroke="#0f9d8a" stroke-width="4.5" stroke-linecap="round"/>
<line x1="313.1" y1="159.4" x2="329.8" y2="286.3" stroke="#0f9d8a" stroke-width="4.5" stroke-linecap="round"/>
<line x1="308.3" y1="268.4" x2="351.3" y2="304.3" stroke="#0f9d8a" stroke-width="6" stroke-linecap="round"/>
<circle cx="329.9" cy="92.5" r="4.5" fill="#ffffff" stroke="#d1543a" stroke-width="1.6"/>
<circle cx="370.0" cy="214.0" r="4.5" fill="#ffffff" stroke="#d1543a" stroke-width="1.6"/>
<circle cx="210.0" cy="98.0" r="7" fill="#1f2328"/>
<circle cx="313.1" cy="159.4" r="6" fill="#0f9d8a"/>
<circle cx="329.8" cy="286.3" r="6" fill="#0f9d8a"/>
<text x="198.0" y="86.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="end">shoulder (root): fixed</text>
<text x="341.9" y="86.5" fill="#d1543a" font-size="12" font-weight="400" text-anchor="start">clip's elbow</text>
<text x="378.0" y="204.0" fill="#d1543a" font-size="12" font-weight="400" text-anchor="start">clip's hand</text>
<text x="301.1" y="181.4" fill="#0f9d8a" font-size="13" font-weight="600" text-anchor="end">elbow: solved</text>
<text x="315.8" y="308.3" fill="#0f9d8a" font-size="13" font-weight="600" text-anchor="end">hand: warped + turned</text>
<line x1="618.0" y1="52.0" x2="618.0" y2="396.0" stroke="#d0d7de" stroke-width="1.2" stroke-linecap="round"/>
<text x="640.0" y="66.0" fill="#1f2328" font-size="13" font-weight="600" text-anchor="start">Shoulder / hip</text>
<text x="640.0" y="84.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">position fixed; only rotates</text>
<text x="640.0" y="100.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">to aim at the solved joint</text>
<text x="640.0" y="128.0" fill="#0f9d8a" font-size="13" font-weight="600" text-anchor="start">Hand / foot</text>
<text x="640.0" y="146.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">warped onto the surface</text>
<text x="640.0" y="162.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">(the formula) and turned</text>
<text x="640.0" y="178.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">from N to n</text>
<text x="640.0" y="206.0" fill="#0f9d8a" font-size="13" font-weight="600" text-anchor="start">Elbow / knee</text>
<text x="640.0" y="224.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">solved: same bone lengths,</text>
<text x="640.0" y="240.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">the clip's bend side</text>
<text x="640.0" y="268.0" fill="#57606a" font-size="13" font-weight="600" text-anchor="start">Fingers / toes</text>
<text x="640.0" y="286.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">follow the hand / foot</text>
<text x="640.0" y="314.0" fill="#d1543a" font-size="13" font-weight="600" text-anchor="start">Reach rule</text>
<text x="640.0" y="332.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">out of reach or over a hole:</text>
<text x="640.0" y="348.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">slide back along the surface</text>
<text x="640.0" y="376.0" fill="#57606a" font-size="13" font-weight="600" text-anchor="start">Dotted circle</text>
<text x="640.0" y="394.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">reach limit: 0.9 × the arm</text>
</svg>
