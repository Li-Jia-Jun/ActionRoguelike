<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<title>Climb detection: side view with the sweep, the grid rows tracing into the wall, the climb up-bias, the dominant plane and the standoff; front view of the 3 by 5 grid with the hand row and the leg rows</title>
