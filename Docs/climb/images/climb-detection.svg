<text x="24.0" y="300.0" fill="#8250df" font-size="12" font-weight="400" text-anchor="start">v_in = clamp((gap − standoff) / dt,</text>
<text x="24.0" y="316.0" fill="#8250df" font-size="12" font-weight="400" text-anchor="start">              ±ClimbIntoWallSpeed)</text>
