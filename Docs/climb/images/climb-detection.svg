<text x="630.0" y="89.0" fill="#1f2328" font-size="12" font-weight="600" text-anchor="middle">±30 cm</text>
<line x1="516.0" y1="277.0" x2="516.0" y2="117.0" stroke="#1f2328" stroke-width="1.0" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="522.0" y="189.0" fill="#1f2328" font-size="11.5" font-weight="600" text-anchor="start">−40…+60</text>
<text x="522.0" y="204.0" fill="#d9822b" font-size="11.5" font-weight="400" text-anchor="start">+20 lift</text>
<text x="772.0" y="109.0" fill="#0f9d8a" font-size="12" font-weight="600" text-anchor="start">Top row = the hands</text>
<text x="772.0" y="125.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">≥ 1 valid: cling</text>
<text x="772.0" y="141.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">≥ 2 valid: move</text>
<text x="772.0" y="269.0" fill="#57606a" font-size="12" font-weight="600" text-anchor="start">Leg rows (legacy)</text>
<text x="772.0" y="285.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">only LowerBodySupport;</text>
<text x="772.0" y="301.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">foot probes decide legs</text>
<text x="500.0" y="456.0" fill="#57606a" font-size="12" font-weight="400" text-anchor="start">All valid normals within 35° of the average → the smoothed dominant plane</text>
